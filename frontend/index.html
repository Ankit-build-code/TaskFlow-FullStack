<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Blinkit Engineering</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ─── Sticky header ─────────────────────────────────────────── -->
  <header class="site-header">
    <div class="header-inner">
      <h1 class="logo">&#9654; TaskFlow</h1>
      <span class="tagline">Blinkit Dark-Store Engineering</span>
    </div>
  </header>

  <!-- ─── Main layout ───────────────────────────────────────────── -->
  <main class="main-content">

    <!-- ── Sidebar: project picker + quick stats ──────────────── -->
    <aside class="sidebar">
      <section class="panel" id="project-panel">
        <h2>Projects</h2>

        <!-- Create project -->
        <form id="project-form" novalidate>
          <div class="field-group">
            <label for="project-name-input">New project name</label>
            <input id="project-name-input" type="text"
                   placeholder="e.g. Sprint 12" autocomplete="off" />
            <span class="field-error" id="project-name-error" aria-live="polite"></span>
          </div>
          <div class="field-group">
            <label for="project-owner-input">Owner user ID</label>
            <input id="project-owner-input" type="number"
                   placeholder="User ID" min="1" />
            <span class="field-error" id="project-owner-error" aria-live="polite"></span>
          </div>
          <button type="submit" class="btn btn-secondary">+ Add Project</button>
        </form>

        <div id="project-list" class="project-list"></div>
      </section>

      <!-- ── Create user ──────────────────────────────────────── -->
      <section class="panel" id="user-panel">
        <h2>Add User</h2>
        <form id="user-form" novalidate>
          <div class="field-group">
            <label for="user-name-input">Name</label>
            <input id="user-name-input" type="text" placeholder="Full name" autocomplete="off" />
            <span class="field-error" id="user-name-error" aria-live="polite"></span>
          </div>
          <div class="field-group">
            <label for="user-email-input">Email</label>
            <input id="user-email-input" type="email" placeholder="user@example.com" />
            <span class="field-error" id="user-email-error" aria-live="polite"></span>
          </div>
          <button type="submit" class="btn btn-secondary">+ Add User</button>
        </form>
      </section>
    </aside>

    <!-- ── Main panel: task management ─────────────────────────── -->
    <section class="task-area">

      <!-- Add task form -->
      <div class="panel" id="add-task-panel">
        <h2>Add Task</h2>

        <!-- Normal add-task form -->
        <form id="task-form" novalidate>
          <div class="form-row">
            <div class="field-group grow">
              <label for="task-title-input">Title <span class="required">*</span></label>
              <input id="task-title-input" type="text"
                     placeholder="What needs to be done?" autocomplete="off" />
              <span class="field-error" id="task-title-error" aria-live="polite"></span>
            </div>
            <div class="field-group">
              <label for="task-priority-input">Priority</label>
              <select id="task-priority-input">
                <option value="medium" selected>Medium</option>
                <option value="low">Low</option>
                <option value="high">High</option>
              </select>
            </div>
            <div class="field-group">
              <label for="task-due-input">Due date</label>
              <input id="task-due-input" type="text"
                     placeholder="e.g. next friday" autocomplete="off" />
            </div>
            <div class="field-group">
              <label for="task-project-select">Project <span class="required">*</span></label>
              <select id="task-project-select">
                <option value="">— select —</option>
              </select>
              <span class="field-error" id="task-project-error" aria-live="polite"></span>
            </div>
          </div>
          <!-- Description below the title bar -->
          <div class="field-group full-width">
            <label for="task-desc-input">Description <span class="optional">(optional)</span></label>
            <textarea id="task-desc-input" rows="2"
                      placeholder="Add more details about this task…"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Add Task</button>
        </form>

        <!-- AI quick-add form -->
        <div class="divider">or use AI Quick-Add</div>
        <form id="quick-add-form" novalidate>
          <div class="form-row">
            <div class="field-group grow">
              <label for="quick-desc-input">Describe the task in plain English</label>
              <input id="quick-desc-input" type="text"
                     placeholder='e.g. "Finish the report next Friday, it\'s urgent"'
                     autocomplete="off" />
              <span class="field-error" id="quick-desc-error" aria-live="polite"></span>
            </div>
            <div class="field-group">
              <label for="quick-project-select">Project <span class="required">*</span></label>
              <select id="quick-project-select">
                <option value="">— select —</option>
              </select>
              <span class="field-error" id="quick-project-error" aria-live="polite"></span>
            </div>
          </div>
          <button type="submit" class="btn btn-ai">&#10024; Quick-Add (AI)</button>
        </form>
      </div>

      <!-- Search + sort controls -->
      <div class="panel controls-panel">
        <div class="controls-row">
          <div class="field-group grow">
            <label for="search-input">Search by exact title</label>
            <input id="search-input" type="text" placeholder="Exact task title…" />
          </div>
          <div class="field-group">
            <label for="search-algo-select">Algorithm</label>
            <select id="search-algo-select">
              <option value="binary">Binary search</option>
              <option value="linear">Linear search</option>
            </select>
          </div>
          <button id="search-btn" class="btn btn-secondary">Search</button>

          <div class="field-group">
            <label for="sort-select">Sort tasks by</label>
            <select id="sort-select">
              <option value="">— none —</option>
              <option value="priority">Priority</option>
              <option value="due_date">Due date</option>
            </select>
          </div>
          <button id="sort-btn" class="btn btn-secondary">Sort</button>
          <button id="clear-search-btn" class="btn btn-ghost">Clear</button>
        </div>
        <div id="search-result-banner" class="search-banner" role="status" aria-live="polite"></div>
      </div>

      <!-- Task list container -->
      <div class="panel task-list-container" id="task-list-container">
        <h2>Tasks <span id="task-count-badge" class="badge">0</span></h2>
        <ul id="task-list" class="task-list" aria-label="Task list"></ul>
        <p id="empty-state" class="empty-state">No tasks yet. Add one above!</p>
      </div>

    </section>
  </main>

  <!-- ─── Edit task modal ───────────────────────────────────────── -->
  <div id="edit-modal" class="modal-overlay" role="dialog"
       aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-box">
      <h3 id="modal-title">Edit Task</h3>
      <form id="edit-form" novalidate>
        <input type="hidden" id="edit-task-id" />
        <div class="field-group">
          <label for="edit-title">Title <span class="required">*</span></label>
          <input id="edit-title" type="text" />
          <span class="field-error" id="edit-title-error" aria-live="polite"></span>
        </div>
        <div class="field-group">
          <label for="edit-description">Description</label>
          <textarea id="edit-description" rows="2" placeholder="Add more details…"></textarea>
        </div>
        <div class="field-group">
          <label for="edit-priority">Priority</label>
          <select id="edit-priority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div class="field-group">
          <label for="edit-due">Due date</label>
          <input id="edit-due" type="text" placeholder="e.g. next friday" />
        </div>
        <div class="field-group">
          <label for="edit-status">Status</label>
          <select id="edit-status">
            <option value="todo">To-do</option>
            <option value="in_progress">In Progress</option>
            <option value="done">Done</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" id="modal-cancel-btn" class="btn btn-ghost">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ─── Toast notification ────────────────────────────────────── -->
  <div id="toast" class="toast" role="alert" aria-live="assertive" hidden></div>

  <script src="script.js"></script>
</body>
</html>
